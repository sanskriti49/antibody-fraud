name: Verify backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: contextcon
          POSTGRES_PASSWORD: contextcon_local
          POSTGRES_DB: contextcon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextcon -d contextcon_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://contextcon:contextcon_local@127.0.0.1:5432/contextcon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:postgres
      - run: npm --prefix web ci
      - run: npm --prefix web run build
